<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ops Log Control Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="header-inner">
      <h1>Ops Log</h1>
      <div id="shift-badge" class="shift-badge">—</div>
    </div>
  </header>

  <main>

    <!-- SHIFT SECTION -->
    <section class="card" id="section-shift">
      <h2>Shift</h2>
      <div class="toggle-row">
        <button class="toggle-btn active" id="btn-auto" onclick="setShiftMode('auto')">Auto-detect</button>
        <button class="toggle-btn" id="btn-override" onclick="setShiftMode('override')">Override</button>
      </div>

      <div id="override-panel" class="hidden">
        <div class="override-inner">
          <div id="calendar"></div>
          <div class="shift-type-picker">
            <button class="seg-btn active" id="seg-day" onclick="setOverrideShiftType('D')">Day</button>
            <button class="seg-btn" id="seg-night" onclick="setOverrideShiftType('N')">Night</button>
          </div>
        </div>
      </div>

      <div id="rota-display" class="rota-display"></div>
    </section>

    <!-- CURRENT IC -->
    <section class="card" id="section-current-ic">
      <h2>Current IC</h2>
      <div id="current-ic-buttons" class="name-buttons"></div>
    </section>

    <!-- INCOMING IC -->
    <section class="card" id="section-incoming-ic">
      <h2>Incoming IC</h2>
      <div id="incoming-ic-buttons" class="name-buttons"></div>
    </section>

    <!-- P3 SECTION -->
    <section class="card" id="section-p3">
      <h2>P3 Turnout</h2>
      <div class="toggle-row">
        <button class="toggle-btn active" id="btn-nop3" onclick="setP3(false)">No P3</button>
        <button class="toggle-btn p3-yes" id="btn-yesp3" onclick="setP3(true)">P3 Occurred</button>
      </div>

      <div id="p3-panel" class="hidden">
        <div class="p3-inner">
          <label class="field-label">Activated by</label>
          <div id="p3-activator-buttons" class="name-buttons"></div>

          <div class="p3-timings">
            <div class="timing-row" data-index="0">
              <span class="timing-label">Activated</span>
              <div class="drum-wrap">
                <div class="drum" id="drum-p3-0-h" data-field="p3-0-h"></div>
                <span class="drum-colon">:</span>
                <div class="drum" id="drum-p3-0-m" data-field="p3-0-m"></div>
              </div>
              <button class="override-toggle" id="ovr-0" onclick="toggleP3Override(0)" title="Override shift window"></button>
            </div>
            <div class="timing-row" data-index="1">
              <span class="timing-label">Left Division</span>
              <div class="drum-wrap">
                <div class="drum" id="drum-p3-1-h" data-field="p3-1-h"></div>
                <span class="drum-colon">:</span>
                <div class="drum" id="drum-p3-1-m" data-field="p3-1-m"></div>
              </div>
              <button class="override-toggle" id="ovr-1" onclick="toggleP3Override(1)" title="Override shift window"></button>
            </div>
            <div class="timing-row" data-index="2">
              <span class="timing-label">Arrived</span>
              <div class="drum-wrap">
                <div class="drum" id="drum-p3-2-h" data-field="p3-2-h"></div>
                <span class="drum-colon">:</span>
                <div class="drum" id="drum-p3-2-m" data-field="p3-2-m"></div>
              </div>
              <button class="override-toggle" id="ovr-2" onclick="toggleP3Override(2)" title="Override shift window"></button>
            </div>
            <div class="timing-row" data-index="3">
              <span class="timing-label">Left Location</span>
              <div class="drum-wrap">
                <div class="drum" id="drum-p3-3-h" data-field="p3-3-h"></div>
                <span class="drum-colon">:</span>
                <div class="drum" id="drum-p3-3-m" data-field="p3-3-m"></div>
              </div>
              <button class="override-toggle" id="ovr-3" onclick="toggleP3Override(3)" title="Override shift window"></button>
            </div>
            <div class="timing-row" data-index="4">
              <span class="timing-label">Reached Division</span>
              <div class="drum-wrap">
                <div class="drum" id="drum-p3-4-h" data-field="p3-4-h"></div>
                <span class="drum-colon">:</span>
                <div class="drum" id="drum-p3-4-m" data-field="p3-4-m"></div>
              </div>
              <button class="override-toggle" id="ovr-4" onclick="toggleP3Override(4)" title="Override shift window"></button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- REDCON (night only) -->
    <section class="card hidden" id="section-redcon">
      <h2>REDCON</h2>
      <p class="hint">Paste the REDCON email below. Alpha manning will be extracted automatically.</p>
      <textarea id="redcon-paste" rows="8" placeholder="Paste REDCON email here…" oninput="parseRedcon()"></textarea>
      <div id="redcon-results" class="redcon-table-wrap hidden"></div>
    </section>

    <!-- GENERATE -->
    <section class="card" id="section-generate">
      <button class="generate-btn" id="generate-btn" onclick="generate()">
        <span id="generate-label">Copy Code to Clipboard</span>
      </button>
      <div id="generate-msg" class="generate-msg hidden"></div>
    </section>

    <!-- SETTINGS -->
    <section class="card" id="section-settings">
      <button class="settings-toggle" onclick="toggleSettings()">
        <span>Settings</span>
        <span id="settings-chevron">▸</span>
      </button>
      <div id="settings-panel" class="hidden">
        <div class="settings-inner">
          <label class="field-label">Google Sheets CSV — Rotas</label>
          <input type="url" id="cfg-rotas-url" placeholder="https://docs.google.com/…" oninput="saveConfig()">

          <label class="field-label">Google Sheets CSV — Appliances</label>
          <input type="url" id="cfg-appliances-url" placeholder="https://docs.google.com/…" oninput="saveConfig()">

          <button class="secondary-btn" onclick="reloadSheets()">Reload from Sheets</button>

          <div id="appliance-list-wrap" class="appliance-list-wrap">
            <label class="field-label">Appliance master list (from sheet)</label>
            <div id="appliance-list"></div>
            <a id="appliances-sheet-link" class="sheet-link hidden" target="_blank" href="#">Open Appliances Sheet ↗</a>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
